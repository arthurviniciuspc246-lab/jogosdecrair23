async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}

function showEvidence(c){const q=el('input','search'),list=el('div');q.placeholder='Filtrar por ID ou descrição';function draw(){list.innerHTML='';evidence.filter(function(e){return (e[0]+' '+e[1]).toLowerCase().includes(q.value.toLowerCase())}).forEach(function(e){const card=el('div','card evid'),ch=document.createElement('input'),t=el('div');ch.type='checkbox';ch.checked=state.found.includes(e[0]);ch.onchange=function(){if(ch.checked&&!state.found.includes(e[0]))state.found.push(e[0]);if(!ch.checked)state.found=state.found.filter(function(x){return x!==e[0]});save()};t.innerHTML='<b>'+e[0]+'</b><div>'+e[1]+'</div>';card.append(ch,t);list.append(card)})}q.oninput=draw;c.append(q,list);draw()}

label('Sua teoria');const tx=document.createElement('textarea');tx.placeholder='Explique como as evidências se conectam.';c.append(tx);const bt=el('button','primary','Formalizar acusação'),res=el('div','result');res.style.display='none';bt.onclick=async function(){const ev=checks.filter(function(x){return x.checked}).map(function(x){return x.value}).sort();if(!s.value||!m.value||!mt.value||!tm.value||ev.length<3||tx.value.trim().length<30){res.style.display='block';res.textContent='A acusação ainda não possui elementos suficientes para formalização.';return}state.attempts++;save();const essential=ev.filter(function(x){return ['EV-006','EV-014','EV-021'].includes(x)}).join(',');const key=s.value+'|'+m.value+'|'+mt.value+'|'+tm.value+'|'+essential;if(await sha(key)===FINAL_HASH){state.solved={suspect:s.value,motive:m.options[m.selectedIndex].text,method:mt.options[mt.selectedIndex].text,time:tm.options[tm.selectedIndex].text};save();res.style.display='block';res.innerHTML='<h2>INVESTIGAÇÃO CONCLUÍDA</h2><p>MANDADO AUTORIZADO.</p><button class="primary" id="finalr">Abrir relatório final</button>';res.querySelector('#finalr').onclick=function(){finalReport(c)}}else{res.style.display='block';res.textContent=state.attempts>=3?'As tentativas formais foram esgotadas. A teoria apresentada não possui sustentação suficiente.':'A teoria apresentada ainda não é sustentada adequadamente pelas evidências coletadas.'}};c.append(bt,res)}
